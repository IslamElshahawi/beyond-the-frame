<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Beyond the Frame: AI films and ads for Gulf brands, told through nine centuries of images.">
<meta name="theme-color" content="#0b0b0c">
<meta property="og:title" content="Islam Elshahawi · AI film director">
<meta property="og:description" content="AI films and ads for Gulf brands, told through nine centuries of images.">
<meta property="og:image" content="hero/campaign.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b0b0c'/%3E%3Cpath d='M14 14h14v6h-8v8h-6zM50 50H36v-6h8v-8h6z' fill='%23f2b43c'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23f3efe7'/%3E%3C/svg%3E">
<title>Islam Elshahawi · AI film director</title>
<!--
THESIS: Nine hundred years of images led here. Real art from every era of picture-making is the world; the director's films fly through it as CineStream sheets. Refuses the dark grid of video cards.
OWN-WORLD: near-black ink UI that recedes, colour only from art and film; Archivo 900 titles that light grey→white; museum wall labels; bending film sheets; noise-edged ink and film-burn transitions.
STORY: meet the lead film in colour → one sentence thesis → six eras, each a principle with real work → watch everything on the wall → contact.
FIRST VIEWPORT: thin black-and-white slices of 11 films on ink; one warms to colour; scroll opens it full-bleed with credit, title, Watch film, All 11 films.
FORM: WebGL scroll film (three r149), DOM overlays for text and controls; storyboard v9 approved 2026-10-10.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@400;600&family=Readex+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: one fixed WebGL stage under a quiet DOM layer; a tall spacer drives the timeline by scroll. */
:root{
  --ink:#0b0b0c; --paper:#f3efe7; --dim:#a39e94; --gold:#f2b43c; --line:rgba(243,239,231,.22);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --f-ar:"Readex Pro","Geeza Pro",Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--paper)}
[hidden]{display:none!important}
html,body{margin:0}
body{font:15px/1.5 var(--f-body);overflow-x:hidden}
html[lang=ar] body{font-family:var(--f-ar)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#scroll{position:relative;z-index:-1;pointer-events:none}
.ui{pointer-events:none}
.ui button,.ui a{pointer-events:auto}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
html[lang=ar] .mono{font-family:var(--f-ar);letter-spacing:0;font-size:12px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ch{display:inline-block;white-space:pre}
.wd{display:inline-block;white-space:nowrap}

/* nav */
.nav{position:fixed;left:0;right:0;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 22px) clamp(16px,3vw,40px) 0;pointer-events:none}
.nav .l{font-size:12.5px;line-height:1.35}.nav .l span{opacity:.6}
.nav .c{font:800 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-align:center}
html[lang=ar] .nav .c{font-family:var(--f-ar)}
.nav .r{display:flex;justify-content:flex-end;gap:clamp(12px,2vw,26px);font-size:12.5px}
.nav button{pointer-events:auto;padding:0;line-height:1.2;opacity:.85}
.nav .c,.nav .l,.nav .r{line-height:1.2}.nav .r{align-items:center}.nav button:hover{opacity:1}
.nav .ar{font-family:var(--f-ar)}
@media (max-width:760px){.nav{grid-template-columns:1fr auto;padding-top:calc(env(safe-area-inset-top,0px) + 16px)}.nav .l{display:none}.nav .c{text-align:left;font-size:13px}.nav .r{gap:16px;font-size:13px}
  html[dir=rtl] .nav .c{text-align:right}}

/* hero */
.hero{position:fixed;inset:0;z-index:6}
.hero .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,5,6,.78),transparent 52%),linear-gradient(90deg,rgba(5,5,6,.45),transparent 50%)}
.hero .lt{position:absolute;left:clamp(16px,4vw,56px);bottom:clamp(24px,5vh,56px);max-width:min(760px,88vw)}
html[dir=rtl] .hero .lt{left:auto;right:clamp(16px,4vw,56px)}
.cr{font:500 11.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
html[lang=ar] .cr{font-family:var(--f-ar);letter-spacing:0;font-size:13px}
.big{font:900 clamp(46px,7.4vw,124px)/.9 var(--f-display);letter-spacing:-.035em;margin:14px 0 22px;text-wrap:balance}
html[lang=ar] .big,html[lang=ar] .ttl,html[lang=ar] .yr,html[lang=ar] .hl,html[lang=ar] .stm div,html[lang=ar] .cta div{font-family:var(--f-ar);letter-spacing:0}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:10px;font:700 12.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:13px 20px;pointer-events:auto}
html[lang=ar] .btn{font-family:var(--f-ar);letter-spacing:0;font-size:14px}
.btn.w{background:var(--paper);color:var(--ink)}.btn.o{border:1px solid rgba(243,239,231,.55)}
.btn:hover{transform:translateY(-1px)}
.hero .rt{position:absolute;right:clamp(16px,4vw,56px);top:22vh;text-align:right}
html[dir=rtl] .hero .rt{right:auto;left:clamp(16px,4vw,56px);text-align:left}
.stat b{display:block;font:900 clamp(34px,3.6vw,56px)/.9 var(--f-display)}.stat{margin-bottom:18px}
.hint{position:fixed;pointer-events:none;left:0;right:0;bottom:28px;text-align:center;z-index:6;color:#c9c3b8}
@media (max-width:760px){.hero .rt{top:auto;bottom:auto;display:none}}

/* statement */
.stm{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;z-index:6;padding:0 16px}
.stm div{font:800 clamp(30px,5.2vw,86px)/1.02 var(--f-display);letter-spacing:-.025em}

/* eras */
.era{position:fixed;inset:0;z-index:6}
.era .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,5,4,.55),transparent 22%),linear-gradient(0deg,rgba(6,5,4,.85),rgba(6,5,4,.35) 42%,transparent 70%)}
.era .blk{position:absolute;left:clamp(16px,4vw,56px);bottom:clamp(26px,6vh,64px);max-width:min(900px,92vw)}
html[dir=rtl] .era .blk{left:auto;right:clamp(16px,4vw,56px)}
.chip{color:var(--gold)}
.yr{font:900 clamp(110px,18vw,300px)/.78 var(--f-display);letter-spacing:-.06em;margin:10px 0 6px}
.hl{font:800 clamp(24px,3.3vw,54px)/1.04 var(--f-display);max-width:20ch;text-wrap:balance}
.lbl{position:fixed;right:clamp(16px,3vw,40px);bottom:clamp(20px,4vh,44px);max-width:min(330px,40vw);z-index:7;font:400 11px/1.5 var(--f-mono);color:rgba(243,239,231,.86);border-left:2px solid var(--gold);padding-left:12px}
.lbl b{display:block;color:var(--gold);font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
html[dir=rtl] .lbl{right:auto;left:clamp(16px,3vw,40px);border-left:0;border-right:2px solid var(--gold);padding:0 12px 0 0;font-family:var(--f-ar);font-size:12px}
@media (max-width:760px){.lbl{display:none}}

/* film titles (CineStream: centred over the sheet) */
.fb{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;z-index:8;padding:0 16px}
.ttl{font:900 clamp(40px,6.6vw,112px)/.92 var(--f-display);letter-spacing:-.035em;text-shadow:0 6px 40px rgba(0,0,0,.45);text-wrap:balance}
.fb .cr{display:block;margin-bottom:14px}
.play{width:62px;height:62px;border-radius:50%;border:1.5px solid rgba(243,239,231,.85);display:inline-grid;place-items:center;margin-top:22px;pointer-events:auto;transition:background .25s,transform .25s}
.play:after{content:"";border-left:15px solid var(--paper);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.play:hover{background:rgba(243,239,231,.14);transform:scale(1.06)}
.case{position:fixed;left:clamp(16px,4vw,56px);bottom:clamp(22px,5vh,52px);max-width:min(380px,40vw);z-index:8;display:grid;gap:10px;font-size:13.5px;line-height:1.45;color:#e7e2d8}
.case span{display:block;font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
html[dir=rtl] .case{left:auto;right:clamp(16px,4vw,56px)}
html[lang=ar] .case span{font-family:var(--f-ar);letter-spacing:0;font-size:12px}
.fb .rm{display:none}
@media (max-width:760px){.case{display:none}.fb{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 6vh);transform:none}.ttl{font-size:clamp(32px,9.5vw,50px)}.fb .cr{margin-bottom:8px}.fb .rm{display:block;margin:10px auto 0;max-width:34ch;font-size:13px;line-height:1.4;color:#d9d3c8}.play{width:52px;height:52px;margin-top:14px}}

/* rail */
.rail{position:fixed;right:clamp(16px,3vw,40px);top:50%;transform:translateY(-50%);z-index:9;display:grid;gap:10px;justify-items:end}
.rail button{font:500 11px var(--f-mono);letter-spacing:.1em;color:rgba(243,239,231,.45);display:flex;align-items:center;gap:8px;pointer-events:auto}
.rail button:after{content:"";width:14px;height:1px;background:currentColor;transition:width .3s}
.rail button.on{color:var(--paper)}.rail button.on:after{width:28px;background:var(--gold)}
html[dir=rtl] .rail{right:auto;left:clamp(16px,3vw,40px);justify-items:start}
@media (max-width:760px){.rail{display:none}}

/* wall */
.wallui{position:fixed;inset:0;z-index:8}
.wallui h2{position:absolute;left:0;right:0;top:12vh;text-align:center;margin:0;font:900 clamp(36px,4.8vw,78px)/1 var(--f-display);letter-spacing:-.03em}
html[lang=ar] .wallui h2{font-family:var(--f-ar);letter-spacing:0}
.chips{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 5vh);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 16px}
.chips button{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(243,239,231,.35);border-radius:999px;padding:9px 15px;pointer-events:auto}
html[lang=ar] .chips button{font-family:var(--f-ar);letter-spacing:0;font-size:13px}
.chips button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.tip{position:fixed;z-index:9;pointer-events:none;transform:translate(14px,14px);background:rgba(11,11,12,.86);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;opacity:0;transition:opacity .2s}
.tip b{display:block;font:800 15px var(--f-display)}
.tip span{font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* skills */
.skills{position:fixed;inset:0;z-index:8}
.sk-h{position:absolute;left:clamp(16px,4vw,56px);top:13vh}
.sk-h h2{margin:8px 0 0;font:900 clamp(40px,5vw,84px)/.9 var(--f-display);letter-spacing:-.035em}
html[lang=ar] .sk-h h2{font-family:var(--f-ar);letter-spacing:0}
.sk-list{position:absolute;left:clamp(16px,4vw,56px);top:calc(13vh + clamp(90px,10vw,150px));list-style:none;margin:0;padding:0;display:grid;gap:clamp(4px,.7vh,10px)}
.sk-list li{font:800 clamp(17px,1.9vw,31px)/1.15 var(--f-display);letter-spacing:-.015em;display:flex;align-items:baseline;gap:14px}
html[lang=ar] .sk-list li{font-family:var(--f-ar);letter-spacing:0}
.sk-list li i{font:500 11px var(--f-mono);font-style:normal;letter-spacing:.1em;color:var(--gold);width:22px}
.sk-d{position:absolute;left:clamp(16px,4vw,56px);bottom:clamp(26px,6vh,60px);max-width:min(520px,44vw);display:grid;gap:8px;font-size:15px;line-height:1.5;color:#e7e2d8}
.sk-d .mono{color:var(--dim)}
.sk-tools{position:absolute;right:clamp(16px,4vw,56px);bottom:clamp(26px,6vh,60px);color:var(--dim)}
html[dir=rtl] .sk-h,html[dir=rtl] .sk-list,html[dir=rtl] .sk-d{left:auto;right:clamp(16px,4vw,56px)}
html[dir=rtl] .sk-tools{right:auto;left:clamp(16px,4vw,56px)}
.sk-now{display:none}
@media (max-width:760px){.sk-list{display:none}.sk-h{top:calc(env(safe-area-inset-top,0px) + 9vh)}.sk-h h2{font-size:clamp(34px,10vw,48px)}.sk-d{max-width:none;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 5vh)}html[dir=rtl] .sk-d{left:16px}.sk-tools{display:none}
  .sk-now{display:block;font:800 22px/1.15 var(--f-display);color:var(--paper)}html[lang=ar] .sk-now{font-family:var(--f-ar)}}

/* phone slider */
.carinfo{display:none}
@media (max-width:760px){
 .wallui h2{top:calc(env(safe-area-inset-top,0px) + 11vh)}
 .chips{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding:0 16px 2px;bottom:calc(env(safe-area-inset-bottom,0px) + 3.5vh);-webkit-mask:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
 .chips::-webkit-scrollbar{display:none}.chips button{flex:none}
 .carinfo{display:grid;justify-items:center;gap:6px;position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 3.5vh + 52px);text-align:center}
 .carinfo .ctitle{font:900 clamp(24px,7vw,32px)/1 var(--f-display);letter-spacing:-.02em}
 html[lang=ar] .carinfo .ctitle{font-family:var(--f-ar);letter-spacing:0}
 .carinfo .cnt{color:var(--gold)}
 .carinfo .btn{margin-top:6px;padding:11px 18px}
}

/* close */
.cta{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;z-index:8;padding:0 16px}
.cta div{font:900 clamp(38px,6vw,100px)/1 var(--f-display);letter-spacing:-.03em}
.cta .g{color:var(--gold)}
.contact{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:10px;width:min(920px,100%);margin:34px auto 0;text-align:start}
.cc{display:flex;align-items:center;gap:12px;min-width:0;padding:12px 14px 12px 12px;border-radius:18px;background:rgba(243,239,231,.06);border:1px solid rgba(243,239,231,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);pointer-events:auto;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,background .3s}
.cc:hover,.cc:focus-visible{transform:translateY(-3px);border-color:var(--gold);background:rgba(243,239,231,.1)}
.cc .ic{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(243,239,231,.1);color:var(--paper)}
.cc.main .ic{background:var(--gold);color:var(--ink)}
.cc .tx{display:grid;min-width:0;gap:2px}
.cc b{font:700 14.5px/1.2 var(--f-body)}
html[lang=ar] .cc b{font-family:var(--f-ar)}
.cc .tx span{font:500 11.5px/1.3 var(--f-mono);color:var(--dim);overflow-wrap:anywhere}
html[dir=rtl] .cc .tx span{text-align:right}
@media (max-width:760px){.contact{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:26px}.cc{padding:10px;gap:10px;border-radius:15px}.cc .ic{width:36px;height:36px;border-radius:11px}.cc b{font-size:13.5px}.cc .tx span{font-size:10.5px}}
.cta .ct{margin-top:20px;color:#cfc9be;font-size:14px;user-select:text;pointer-events:auto}
.cta .btn svg{flex:none}
.foot{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;z-index:8;color:#bdb7ac}

/* theatre */
#th{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(6,6,7,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#th .in{display:grid;grid-template-columns:auto minmax(0,380px);gap:clamp(20px,4vw,56px);align-items:center;max-width:1180px;padding:24px}
#th .vb{position:relative;height:min(82vh,820px);aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 40px 120px rgba(0,0,0,.6)}
#th video{width:100%;height:100%;object-fit:cover;display:block}
#th .ctl{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 12px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);display:flex;align-items:center;gap:10px}
#th .ctl button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.4);font-size:12px}
#th .ctl input{flex:1;accent-color:var(--gold);min-width:0}
#th .ctl .tc{font:500 11px var(--f-mono);font-variant-numeric:tabular-nums;color:#ddd;min-width:84px;text-align:right}
#th aside{display:grid;gap:16px;align-content:center;font-size:14.5px;line-height:1.55;color:#e4dfd5}
#th aside h3{font:900 clamp(32px,3.6vw,54px)/.95 var(--f-display);letter-spacing:-.03em;margin:4px 0 0;color:var(--paper)}
html[lang=ar] #th aside h3{font-family:var(--f-ar);letter-spacing:0}
#th aside .k{display:block;font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
html[lang=ar] #th aside .k{font-family:var(--f-ar);letter-spacing:0;font-size:12px}
#th aside>div{min-width:0}
#th .more{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;width:100%;max-width:100%}
#th .more button{flex:none;width:54px;height:96px;border-radius:5px;background-size:cover;background-position:center;opacity:.6;transition:opacity .2s}
#th .more button:hover,#th .more button.on{opacity:1;outline:1.5px solid var(--gold)}
#th .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:22px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);font-size:18px}
#th .nv{display:flex;gap:10px}
#th .nv button{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
@media (max-width:860px){#th{display:block;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}#th .in{grid-template-columns:minmax(0,1fr);justify-items:center;padding:calc(env(safe-area-inset-top,0px) + 74px) 16px calc(env(safe-area-inset-bottom,0px) + 32px)}#th .vb{height:auto;width:min(100%,calc(64vh * 9 / 16))}#th aside{width:100%;max-width:520px;min-width:0}#th .more{max-width:100%}#th .x{position:fixed;z-index:2;background:rgba(6,6,7,.7)}}

#vids{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.001;pointer-events:none;overflow:hidden;z-index:-2}
#vids video{width:2px;height:2px}
.skip{position:fixed;left:12px;top:-60px;z-index:60;background:var(--paper);color:var(--ink);padding:10px 14px;border-radius:6px}
.skip:focus{top:12px}
#nogl{display:none;padding:110px clamp(16px,4vw,56px) 60px}
.nogl #nogl{display:block}.nogl #gl,.nogl .ui,.nogl #scroll{display:none}
#nogl .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:24px}
#nogl .grid button{aspect-ratio:9/16;border-radius:8px;background-size:cover;background-position:center;position:relative;text-align:left}
#nogl .grid span{position:absolute;left:8px;right:8px;bottom:8px;font:800 14px var(--f-display);text-shadow:0 2px 10px #000}
.loader{position:fixed;inset:0;z-index:40;background:var(--ink);display:grid;place-items:center;transition:opacity .6s}
.loader.off{opacity:0;pointer-events:none}
</style>
</head>
<body>


<a class="skip" href="#" id="skip">Skip to all films</a>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="scroll"></div>
<div id="vids" aria-hidden="true"></div>

<header class="nav" id="nav">
  <div class="l" id="navL"></div>
  <div class="c" id="navName">Islam Elshahawi</div>
  <nav class="r" aria-label="Site">
    <button type="button" id="navFilms"></button>
    <button type="button" id="navContact"></button>
    <button type="button" id="navLang" class="ar"></button>
  </nav>
</header>

<main id="ui"></main>
<div class="tip" id="tip"></div>
<div class="loader" id="loader"><div class="mono" style="color:var(--dim)">Islam Elshahawi</div></div>

<div id="th" hidden role="dialog" aria-modal="true" aria-labelledby="thTitle">

    let best=-1,bd=1e9;CARDS.forEach((cd,i)=>{if(!PICKABLE.includes(cd.m))return;const sz=cd.u.uSize.value;const pos=cd.m.position;const q=new THREE.Plane(new THREE.Vector3(0,0,1).applyEuler(cd.m.rotation),0).translate(pos);
      const hit=new THREE.Vector3();if(!ray.ray.intersectPlane(q,hit))return;const lp=cd.m.worldToLocal(hit.clone());if(Math.abs(lp.x)<sz.x/2&&Math.abs(lp.y)<sz.y/2){const dd=hit.distanceTo(cam.position);if(dd<bd){bd=dd;best=i}}});
  return best}
function wallTip(){const tip=$('tip');if(HOVER>=0){const F=FILMS[WALL_ORDER[HOVER]];if(tip._id!==HOVER){tip._id=HOVER;tip.innerHTML=`<b>${L(F.title)}</b><span>${L(F.credit)}</span>`}S(tip,'left',PX+'px');S(tip,'top',PY+'px');S(tip,'opacity','1');document.body.style.cursor='pointer'}
  else{S(tip,'opacity','0');document.body.style.cursor=''}
}
function inWall(){const s=sy;return s>TL.wall[0]+U.WALLIN*.6&&s<TL.skills[0]+.2}
let T0X=0,T0Y=0,T0P=0,TMODE='',TT=0,TV=0,TLX=0;
addEventListener('touchstart',e=>{if(THEATRE||!PHONE||!inWall()||e.target.closest('button,a,.chips'))return;const t=e.touches[0];T0X=TLX=t.clientX;T0Y=t.clientY;T0P=CAR.pos;TMODE='?';TT=performance.now();TV=0},{passive:true});
addEventListener('touchmove',e=>{if(!TMODE)return;const t=e.touches[0],dx=t.clientX-T0X,dy=t.clientY-T0Y;
  if(TMODE==='?'){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.1){TMODE='x';CAR.drag=true}else if(Math.abs(dy)>10){TMODE='';return}}
  if(TMODE==='x'){e.preventDefault();const side=LANG==='ar'?-1:1,n=carList().length,step=carSize().w*.82;let p=T0P-side*dx/step;
    if(p<0)p*=.35;if(p>n-1)p=n-1+(p-n+1)*.35;TV=(t.clientX-TLX);TLX=t.clientX;CAR.pos=p}},{passive:false});
addEventListener('touchend',e=>{if(!TMODE)return;const side=LANG==='ar'?-1:1,n=carList().length;
  if(TMODE==='x'){CAR.drag=false;CAR.target=clamp(Math.round(CAR.pos-side*TV*.06),0,n-1)}
  else if(TMODE==='?'&&performance.now()-TT<450){const t=e.changedTouches[0],cx=VW/2,z=carSize();const dx=(t.clientX-cx)*side;
    if(Math.abs(dx)<z.w*.5&&Math.abs(t.clientY-(VH/2+VH*.07))<z.h*.55){const id=carList()[Math.round(CAR.target)];if(id)openFilm(id,CARDS[WALL_ORDER.indexOf(id)])}
    else if(Math.abs(t.clientY-(VH/2+VH*.07))<z.h*.5)CAR.target=clamp(Math.round(CAR.target)+(dx>0?1:-1),0,n-1)}
  TMODE=''},{passive:true});
addEventListener('click',e=>{if(THEATRE||PHONE)return;if(e.target.closest('button,a'))return;PX=e.clientX;PY=e.clientY;const i=pickCard();if(i<0)return;openFilm(WALL_ORDER[i],CARDS[i])});

/* ---- skills: the craft, each proven by a film on a sheet ---- */
function skills(s,av){const [k0,k1]=TL.skills;const u=SKUI;
  const on=s>k0+U.SKIN*.7&&s<k1+.3;const o=seg(s,k0+U.SKIN*.7,k0+U.SKIN+.15)*(1-seg(s,k1-.1,k1+.25));vis(u.sk,on?o:0);
  if(!on){return}
  light(u.sksp,seg(s,k0+U.SKIN*.75,k0+U.SKIN+.25));
  let ai=0;TL.skRest.forEach((r,i)=>{if(s>r-U.SKILL*.3)ai=i});
  u.items.forEach((li,i)=>{const a=i===ai?1:clamp(.26-Math.abs(i-ai)*.02,.12,.3);S(li,'opacity',String(f2(a*E.o3(clamp(o*1.6-i*.04)))));S(li,'transform',`translateX(${i===ai?(LANG==='ar'?-14:14):0}px)`)});
  if(u.cur!==ai){u.cur=ai;const k=SKILLS[ai];u.sknow.textContent=L(k.t);u.skdt.textContent=L(k.d);u.skds.textContent=t_('seen')+': '+L(FILMS[k.film].title);
    u.skd.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:450,easing:'cubic-bezier(.2,.8,.2,1)'})}
  const mob=VW<760,side=LANG==='ar'?-1:1;
  SKILLS.forEach((k,i)=>{const d=(s-TL.skRest[i])/U.SKILL;if(d<-1.05||d>1.05)return;const h=.18;
    const de=d<0?Math.min(0,(d+h)/(1-h)):Math.max(0,(d-h)/(1-h));const dir=i%2?1:-1;
    const w=mob?Math.min(VW*.5,VH*.4*9/16):SW*.86,hh=w*16/9;
    let x=mob?0:side*VW*.2,y=mob?-VH*.03:0,z=0,rx=6,ry=-14*side,rz=-5*dir,op=1;
    if(de<0){const a=E.o3(1+de),b=E.back(1+de);y+=lerp(VH*.95,0,a);z=lerp(-300,0,a);rx=lerp(36,6,b);rz=lerp(16*dir,-5*dir,b);op=seg(1+de,0,.12)}
    else{const q=E.i3(de);y-=q*VH*1.15;z=q*520;rx=6-q*34;rz=(-5-q*18)*dir;op=1-seg(de,.78,.96)}
    if(i===SKILLS.length-1&&d>0)op*=1-seg(s,k1-.1,k1+.2);
    const bend=(5+Math.sin(Math.PI*Math.min(1,Math.abs(de)))*28+av*14)*M,tw=(Math.sin(TIME*1.3+i)*3+de*8)*M,ro=600+Math.round(z/4);
    SKS[i].u.uTex.value=texFor('pv/'+k.film+'.mp4',FR(FILMS[k.film].frame));
    put(SKS[i],{w,h:hh,x,y,z,rx:rx*M,ry:ry*M,rz:rz*M,bend,tw,dim:.04,op,glow:.05,ro,sheen:clamp(1+d*2.2,0,1.6),shA:MOTION?.5*clamp(1-Math.abs(d)*2.4):0});
    putShadow(SKSD[i],{w,h:hh,x,y,z,rx:rx*M,ry:ry*M,rz:rz*M,bend,op,ro})});
}

/* ---- close: the films scatter, every era returns as a strip ---- */
function closing(s){const [c0,c1]=TL.close;const k=seg(s,c0+U.CLOSE*.12,c0+U.CLOSE*.6);
  if(s<c0){vis(CTA.c,0);vis(FOOT,0);return}
  const n=STRIPS.length;STRIPS.forEach((st,i)=>{const o=img(ERAS[i].art);st.ar=o.ar;st.u.uTex.value=o.t;const a=E.o3(clamp(k*1.6-i*.1));if(a<=0)return;const w=VW/n;
    put(st,{w:w+1,h:VH*1.1,x:-VW/2+w*(i+.5),y:(i%2?1:-1)*(1-a)*VH*.6+Math.sin(TIME*.3+i)*VH*.01,z:-60,dim:.62,op:a,ro:1})});
  const ck=seg(s,c0+U.CLOSE*.45,c0+U.CLOSE*.75);vis(CTA.c,ck>0?1:0);rise(CTA.s1,ck);rise(CTA.s2,seg(s,c0+U.CLOSE*.52,c0+U.CLOSE*.85));
  [...CTA.cb.children,CTA.ct].forEach((b,i)=>{const a=E.o4(seg(s,c0+U.CLOSE*.66+i*.03,c0+U.CLOSE*.86+i*.03));S(b,'opacity',String(f2(a)));S(b,'transform',`translateY(${f2((1-a)*12)}px)`)});
  vis(FOOT,seg(s,c0+U.CLOSE*.8,c1))}

/* ===================== theatre ===================== */
const TH=$('th'),thv=$('thv');let CURF=null,lastFocus=null;
function fmt(t){t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function fill(id){CURF=id;const F=FILMS[id];$('thCredit').textContent=L(F.credit);$('thTitle').textContent=L(F.title);$('thBrief').textContent=L(F.brief);$('thIdea').textContent=L(F.idea);$('thRole').textContent=L(F.role);
  thv.poster=FR(F.frame);thv.src='full/'+id+'.mp4';thv.muted=false;thv.currentTime=0;const p=thv.play();if(p&&p.catch)p.catch(()=>{thv.muted=true;thv.play().catch(()=>{})});
  const m=$('thMore');m.innerHTML='';WALL_ORDER.forEach(k=>{const b=el('button',k===id?'on':'',m);b.type='button';b.style.backgroundImage=`url(${FR(FILMS[k].frame)})`;b.setAttribute('aria-label',L(FILMS[k].title));b.onclick=()=>fill(k)})}
function openFilm(id,card){lastFocus=document.activeElement;THEATRE=true;TH.hidden=false;fill(id);document.body.style.overflow='hidden';
  const box=$('thBox');
  if(card&&card.m.visible&&MOTION){/* shared-element flight: from the card on the wall to the player */
    const r=screenRect(card);const b=box.getBoundingClientRect();
    box.animate([{transform:`translate(${r.x-b.x}px,${r.y-b.y}px) scale(${r.w/b.width},${r.h/b.height})`,borderRadius:'6px',transformOrigin:'0 0'},{transform:'none',transformOrigin:'0 0'}],{duration:620,easing:'cubic-bezier(.2,.8,.2,1)'});
    TH.animate([{backgroundColor:'rgba(6,6,7,0)'},{backgroundColor:'rgba(6,6,7,.9)'}],{duration:500});
    TH.querySelector('aside').animate([{opacity:0,transform:'translateX(24px)'},{opacity:1,transform:'none'}],{duration:500,delay:260,fill:'backwards',easing:'cubic-bezier(.2,.8,.2,1)'})}
  else{TH.animate([{opacity:0},{opacity:1}],{duration:300})}
  setTimeout(()=>$('thX').focus(),50)}
function closeFilm(){thv.pause();THEATRE=false;TH.hidden=true;document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function screenRect(cd){const sz=cd.u.uSize.value;const pts=[[-.5,-.5],[.5,-.5],[-.5,.5],[.5,.5]].map(([a,b])=>{const v=new THREE.Vector3(a*sz.x,b*sz.y,0);cd.m.localToWorld(v);v.project(cam);return[(v.x+1)/2*VW,(1-v.y)/2*VH]});
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}}
$('thX').onclick=closeFilm;
$('thPlay').onclick=()=>thv.paused?thv.play():thv.pause();
thv.addEventListener('play',()=>$('thPlay').textContent='❚❚');thv.addEventListener('pause',()=>$('thPlay').textContent='▶');
thv.addEventListener('timeupdate',()=>{$('thSeek').value=thv.duration?Math.round(thv.currentTime/thv.duration*1000):0;$('thTime').textContent=fmt(thv.currentTime)+' / '+fmt(thv.duration)});
thv.addEventListener('ended',()=>step2(1));
$('thSeek').oninput=e=>{if(thv.duration)thv.currentTime=e.target.value/1000*thv.duration};
$('thMute').onclick=()=>{thv.muted=!thv.muted;$('thMute').textContent=thv.muted?'🔇':'🔊'};
function step2(d){const i=WALL_ORDER.indexOf(CURF);fill(WALL_ORDER[(i+d+WALL_ORDER.length)%WALL_ORDER.length])}
$('thPrev').onclick=()=>step2(LANG==='ar'?1:-1);$('thNext').onclick=()=>step2(LANG==='ar'?-1:1);
addEventListener('keydown',e=>{if(!THEATRE)return;if(e.key==='Escape')closeFilm();else if(e.key===' '){e.preventDefault();thv.paused?thv.play():thv.pause()}
  else if(e.key==='ArrowRight')thv.currentTime+=5;else if(e.key==='ArrowLeft')thv.currentTime-=5;else if(e.key==='m'||e.key==='M')$('thMute').click();
  else if(e.key==='Tab'){const f=[...TH.querySelectorAll('button,input')].filter(x=>x.offsetParent);const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});

/* ===================== nav ===================== */
function jumpTo(u){scrollTo({top:u*VH,behavior:'instant'});sy=u}
$('navFilms').onclick=()=>jumpTo(TL.hold[0]+.15);$('navContact').onclick=()=>jumpTo(TL.close[1]);$('skip').onclick=e=>{e.preventDefault();jumpTo(TL.hold[0]+.15)};

$('navLang').onclick=()=>{LANG=LANG==='en'?'ar':'en';try{localStorage.setItem('btf-lang',LANG)}catch(e){}buildUI();if(THEATRE&&CURF){const t=thv.currentTime;fill(CURF);thv.currentTime=t}};
addEventListener('resize',()=>{measure()});

/* ===================== boot ===================== */
buildUI();
if(renderer){measure();setPlateB(0);ERAS.slice(0,2).forEach(e=>img(e.art));
  try{renderer.compile(scene,cam);renderer.compile(pscene,pcam)}catch(e){}
  requestAnimationFrame(frame);setTimeout(()=>$('loader').classList.add('off'),350)}
else{$('loader').classList.add('off')}
window.__btf={TL,U,SLOTS,get s(){return sy},go:jumpTo};
